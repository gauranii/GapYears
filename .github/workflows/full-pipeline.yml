name: Full pipeline (live WHO data)

# Runs run_all.R end to end against the live WHO GHO API and GHE bulk xlsx
# downloads. Not run on every push -- it's slow (fresh ~72MB of xlsx downloads)
# and network-dependent, so a WHO-side hiccup shouldn't block a PR. Exists as
# an early warning that an upstream API/file format changed, not as a gate.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC

jobs:
  run-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run the full pipeline against live WHO endpoints
        run: nix develop --command Rscript run_all.R

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            data_processed/
            output/
